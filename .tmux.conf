# term 
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# prefix is `
set -g prefix `
bind C-q send-prefix
unbind C-b

#stuff
set -gq allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM


# so vim and co is not hell
set -sg escape-time 1
set -g base-index 1
setw -g pane-base-index 1

# mouse works as expected
set -g mouse on

setw -g monitor-activity on
set -g visual-activity on

set -g mode-keys vi
set -g history-limit 10000
set -g set-clipboard on

bind c new-window -c "#{pane_current_path}"
bind R source-file ~/.tmux.conf

# easy-to-remember split pane commands
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# resize panes with vim movement keys
bind -r m resize-pane -L 5
bind -r n resize-pane -D 5
bind -r e resize-pane -U 5
bind -r i resize-pane -R 5

# plugins

# list of tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes


#Sessionizer scripts
bind f run "tmux neww ~/dotfiles/scripts/tmux-session-dispensary.sh"
bind B run "~/dotfiles/scripts/tmux-session-dispensary.sh ~/Library/Mobile\ Documents/com~apple~CloudDocs"
bind P run "~/dotfiles/scripts/tmux-session-dispensary.sh ~/documents/projects"
bind D run "~/dotfiles/scripts/tmux-session-dispensary.sh ~/dotfiles"
bind H run "~/dotfiles/scripts/tmux-session-dispensary.sh ~"
bind W run "~/dotfiles/scripts/tmux-session-dispensary.sh ~/dev/personalwebsite"

#tmux nvim
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-m' if-shell "$is_vim" 'send-keys C-m'  'select-pane -L'
bind-key -n 'C-n' if-shell "$is_vim" 'send-keys C-n'  'select-pane -D'
bind-key -n 'C-e' if-shell "$is_vim" 'send-keys C-e'  'select-pane -U'
bind-key -n 'C-i' if-shell "$is_vim" 'send-keys C-i'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-m' select-pane -L
bind-key -T copy-mode-vi 'C-n' select-pane -D
bind-key -T copy-mode-vi 'C-e' select-pane -U
bind-key -T copy-mode-vi 'C-i' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

#Everforest Palette 
text_color="#D3C6AA"
green="#A7C080"
red="#E67E80"
cyan="#7FBBB3"
dark_text="#272E33"
everforest_bg1="#2e383c"

#bar
set -g status-style "fg=${text_color} bg=default"
set -g status-position top
set -g status-left-length 100
set -g status-left "#[fg=${green},bold]#S #[fg=${text_color}, nobold] |"
set -g status-justify absolute-centre
set -g visual-activity off
set -g window-status-activity-style none
set -g window-status-current-format "#[fg=${red}, bold] #I:#W" 
set -g status-right "#[fg=${text_color}]| #[fg=${green}, bold]%H:%M %d-%b-%y"
set -g message-style "fg=${text_color}, bg=default"
set -g mode-style "fg=${dark_text}, bg=${green}"

#border
set -g pane-border-style "fg=${everforest_bg1}" # fg=bg1
set -g pane-active-border-style "fg=${green}" # fg=blue

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
